<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Pictures in a Row</title>
    <style>
        .image-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }
        .image-container img {
            width: 18%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="https://picsum.photos/200/300?random=1" alt="Random image 1">
        <img src="https://picsum.photos/200/300?random=2" alt="Random image 2">
        <img src="https://picsum.photos/200/300?random=3" alt="Random image 3">
        <img src="https://picsum.photos/200/300?random=4" alt="Random image 4">
        <img src="https://picsum.photos/200/300?random=5" alt="Random image 5">
    </div>
</body>
</html>
